name: Data quality

on:
  workflow_dispatch:
  push:
    paths:
      - "web/public/data/**"
      - "python/src/fantasy_football_prediction_model/schemas.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m fantasy_football_prediction_model.cli project validate
      - name: Reject unmarked fixture on main protection note
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("web/public/data/metadata.json").read_text())
          print("dataMode=", meta.get("dataMode"))
          print("projectionSeason=", meta.get("projectionSeason"))
          print("playerCount=", meta.get("playerCount"))
          assert meta.get("schemaVersion"), "schemaVersion missing"
          assert meta.get("playerCount", 0) > 0
          PY
