name: Refresh projections

on:
  workflow_dispatch:
    inputs:
      target_season:
        description: "Target projection season"
        required: false
        default: "2026"
      fixture:
        description: "Generate fixture data instead of production"
        type: boolean
        default: false
  # Modest offseason cadence. Disable in repo settings if unused.
  schedule:
    - cron: "0 12 1 3,6,9 *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          FFPM_TARGET_SEASON: ${{ inputs.target_season || '2026' }}
        run: |
          cd python
          if [ "${{ inputs.fixture }}" = "true" ]; then
            python -m fantasy_football_prediction_model.cli project generate --fixture
          else
            python -m fantasy_football_prediction_model.cli pipeline run-all || \
              python -m fantasy_football_prediction_model.cli project generate --fixture
          fi
          python -m fantasy_football_prediction_model.cli project validate
      - uses: actions/upload-artifact@v4
        with:
          name: projection-artifacts
          path: |
            artifacts/projections/
            web/public/data/
      - name: Open PR when outputs change
        if: github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh projection exports"
          title: "chore: refresh projection exports"
          body: |
            Automated projection refresh.
            Review dataMode in metadata.json before merging.
          branch: chore/refresh-projections
