[project]
name = "fantasy-football-prediction-model"
version = "1.0.0"
description = "Reproducible NFL fantasy-football projection system built on free, open data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "fantasy-football-prediction-model contributors" }]
keywords = ["nfl", "fantasy-football", "machine-learning", "nflverse", "projections"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "nflreadpy>=0.1.4,<1.0",
  "polars>=1.9,<2.0",
  "pyarrow>=17,<23",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.13,<2.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.8,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "joblib>=1.4,<2.0",
  "pyyaml>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "tenacity>=8.5,<10.0",
  "platformdirs>=4.2,<5.0",
]

[project.optional-dependencies]
# Optional gradient-boosting backends. The project has a complete
# scikit-learn fallback, so a failed install here never breaks the pipeline.
boosting = [
  "lightgbm>=4.4,<5.0",
  "xgboost>=2.1,<4.0",
]
# Optional SHAP explanations. Falls back to permutation importance.
explain = [
  "shap>=0.45,<1.0",
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-PyYAML>=6.0,<7.0",
  "pandas-stubs>=2.2,<3.0",
]
notebooks = [
  "jupyter>=1.0,<2.0",
  "matplotlib>=3.9,<4.0",
  "seaborn>=0.13,<1.0",
]

[project.urls]
Homepage = "https://github.com/USERNAME/fantasy-football-prediction-model"
Repository = "https://github.com/USERNAME/fantasy-football-prediction-model"
Documentation = "https://github.com/USERNAME/fantasy-football-prediction-model/tree/main/docs"

[project.scripts]
ffpm = "fantasy_football_prediction_model.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_football_prediction_model"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["../notebooks"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "PTH",  # flake8-use-pathlib
  "RUF",  # ruff-specific
  "ANN",  # flake8-annotations
  "T20",  # flake8-print
  "TRY",  # tryceratops
  "PL",   # pylint
]
ignore = [
  "ANN401",  # allow typing.Any where a boundary genuinely needs it
  "PLR0913", # many-argument functions are common in modelling code
  "PLR0915", # pipeline stages are long by nature
  "PLR0912", # branching in backtests / adapters is intentional
  "PLR0911", # estimator factories and request helpers have many returns
  "PLR0917", # Typer CLI commands take many Option arguments
  "PLR2004", # magic values are heavily used in statistical thresholds
  "PLC0415", # lazy imports avoid circular deps and optional backends
  "PLW0603", # logging module uses a one-time global configure flag
  "TRY003",  # long messages inside raise are more useful than short ones here
  "TRY300",  # try/return for optional imports is clearer than else blocks
  "TRY400",  # logger.error is intentional in CLI-facing error paths
  "TRY004",  # ValueError is fine for invalid YAML shape at the boundary
  "UP042",   # keep str, Enum for broader Python compatibility
  "RUF002",  # allow multiplication sign in docstrings
  "N803",    # X/y are the scikit-learn convention
  "N806",    # X_train etc. are the scikit-learn convention
  "E501",    # line length enforced by the formatter where practical
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004", "S101", "PLR0915"]
"src/fantasy_football_prediction_model/cli.py" = ["T20", "PLR0915", "B008", "ANN202", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["fantasy_football_prediction_model"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "network: test requires live network access (deselect with -m 'not network')",
  "slow: test takes more than a few seconds",
]
filterwarnings = [
  "ignore::DeprecationWarning:joblib.*",
]

[tool.coverage.run]
source = ["src/fantasy_football_prediction_model"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
